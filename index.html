<!DOCTYPE html>
<html lang="id" style="background-color:#f5f5f5;">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/fuelguard_white.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="msapplication-TileColor" content="#143d2e">
    <meta name="msapplication-TileImage" content="/windows11/Square150x150Logo.scale-100.png">
    <meta name="msapplication-square70x70logo" content="/windows11/SmallTile.scale-100.png">
    <meta name="msapplication-square150x150logo" content="/windows11/Square150x150Logo.scale-100.png">
    <meta name="msapplication-wide310x150logo" content="/windows11/Wide310x150Logo.scale-100.png">
    <meta name="msapplication-square310x310logo" content="/windows11/LargeTile.scale-100.png">
    <title>FuelGuard Management System</title>
    <meta name="theme-color" content="#143d2e">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  </head>
  <body style="background-color:#f5f5f5; min-height:100vh; min-height:100dvh; margin:0;">
    <div id="app">
      <style>
        .initial-loader {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background-color: #f5f5f5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .initial-loader-spinner {
          width: 50px;
          height: 50px;
          border: 4px solid #e5e7eb;
          border-top-color: #143d2e;
          border-radius: 50%;
          animation: initial-spin 1s linear infinite;
          margin-bottom: 20px;
        }
        .initial-loader-text {
          color: #143d2e;
          font-weight: 700;
          font-size: 1.25rem;
          letter-spacing: 0.05em;
        }
        @keyframes initial-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-text">FuelGuard</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
